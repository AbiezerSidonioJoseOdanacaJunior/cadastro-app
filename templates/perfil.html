<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil do Usuário</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Perfil do Usuário</h1>

    <p><strong>ID:</strong> {{ usuario.id }}</p>

    <form action="/editar_perfil" method="POST">
      <label>Nome</label>
      <input type="text" name="nome" value="{{ usuario.nome }}" required>

      <label>Email</label>
      <input type="email" name="email" value="{{ usuario.email }}" required>

      <button type="submit">Salvar Alterações</button>
    </form>

    <br>

    <form action="/excluir_perfil" method="POST" onsubmit="return confirm('Tem certeza que deseja excluir sua conta?');">
      <button type="submit" style="background-color: #d9534f;">Excluir Conta</button>
    </form>

    <br>
    <a href="/logout">Sair</a>
  </main>
</body>
</html>
